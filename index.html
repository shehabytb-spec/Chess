<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شطرنج العقل الاحترافية</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root {
            --bg-primary: #0f171e;
            --bg-secondary: #1b2631;
            --accent-green: #1b4d3e;
            --accent-green-bright: #2ecc71;
            --text-main: #ecf0f1;
            --text-muted: #bdc3c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        
        header { background-color: var(--bg-secondary); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent-green); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        header h1 { font-size: 1.6rem; color: var(--accent-green-bright); }
        nav a { color: var(--text-muted); text-decoration: none; margin-right: 20px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        nav a:hover { color: var(--accent-green-bright); }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 30, 0.95);
            display: flex; justify-content: center; align-items: center; z-index: 999;
        }
        .auth-card, .game-over-card, .promotion-card {
            background-color: var(--bg-secondary); padding: 35px; border-radius: 12px;
            text-align: center; width: 380px; border: 2px solid var(--accent-green);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .promotion-options { display: flex; justify-content: space-around; margin-top: 20px; gap: 10px; }
        .promotion-btn {
            background: var(--bg-primary); border: 2px solid var(--accent-green-bright);
            border-radius: 8px; font-size: 2.5rem; cursor: pointer; padding: 10px;
            flex: 1; transition: 0.2s; color: var(--text-main);
        }
        .promotion-btn:hover { background: var(--accent-green-bright); transform: scale(1.1); color: #000; }

        .border-win { border-color: #2ecc71 !important; box-shadow: 0 0 25px rgba(46, 204, 113, 0.5); }
        .border-loss { border-color: #e74c3c !important; box-shadow: 0 0 25px rgba(231, 76, 60, 0.5); }
        .border-draw { border-color: #f1c40f !important; box-shadow: 0 0 25px rgba(241, 196, 15, 0.5); }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 12px; transition: 0.3s;
        }
        .btn-google { background-color: #ffffff; color: #333; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-guest { background-color: var(--accent-green); color: #fff; }
        .btn-action { background-color: var(--accent-green); color: #fff; margin-top: 10px; }
        .btn-action:hover { background-color: var(--accent-green-bright); color: #000; }

        .main-container { display: flex; flex: 1; padding: 25px; gap: 30px; justify-content: center; align-items: flex-start; max-width: 1300px; margin: 0 auto; width: 100%; }
        
        .side-panel { background-color: var(--bg-secondary); border-radius: 12px; padding: 20px; width: 300px; border: 1px solid rgba(46, 204, 113, 0.2); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .side-panel h3 { margin-bottom: 15px; font-size: 1.1rem; color: var(--accent-green-bright); border-bottom: 1px solid var(--accent-green); padding-bottom: 5px; }

        .move-history-container { height: 200px; overflow-y: auto; background: var(--bg-primary); border-radius: 6px; padding: 5px; }
        .move-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.9rem; }
        .move-table th { background-color: var(--accent-green); color: white; padding: 6px; }
        .move-table td { padding: 6px; border-bottom: 1px solid #2c3e50; }

        .control-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
        .control-group label { font-size: 0.85rem; color: var(--text-muted); }
        .control-group select, .control-group input { padding: 8px; border-radius: 6px; background: var(--bg-primary); color: white; border: 1px solid var(--accent-green); }

        .board-container { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #board { width: 480px; max-width: 85vw; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 3px solid var(--accent-green); }
        
        /* مؤشرات التظليل */
        .highlight-square { 
            background: radial-gradient(circle, rgba(46, 204, 113, 0.6) 0%, rgba(39, 174, 96, 0.3) 100%) !important;
            box-shadow: inset 0 0 8px #2ecc71 !important;
        }
        .highlight-move { 
            box-shadow: inset 0 0 10px 3px rgba(46, 204, 113, 0.8), 0 0 5px rgba(46, 204, 113, 0.5) !important;
            cursor: pointer; 
        }
        .highlight-capture { 
            background: radial-gradient(circle, rgba(231, 76, 60, 0.7) 0%, rgba(192, 57, 43, 0.4) 100%) !important;
            box-shadow: inset 0 0 12px #e74c3c, 0 0 8px #e74c3c !important;
            cursor: pointer; 
        }
        .highlight-check {
            background: radial-gradient(circle, rgba(139, 0, 0, 0.85) 0%, rgba(75, 0, 0, 0.95) 100%) !important;
            box-shadow: inset 0 0 15px 4px #ff0000, 0 0 20px #8b0000 !important;
        }
        .highlight-checkmate {
            background: radial-gradient(circle, rgba(255, 20, 147, 0.85) 0%, rgba(199, 21, 133, 0.95) 100%) !important;
            box-shadow: inset 0 0 18px 5px #ff69b4, 0 0 25px #ff1493 !important;
        }

        /* العدادات */
        .timer-container { display: flex; justify-content: space-between; width: 100%; margin-bottom: 10px; gap: 15px; }
        .timer-box { background: var(--bg-secondary); border: 1px solid var(--accent-green); padding: 8px 15px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; flex: 1; text-align: center; }
        .timer-active { border-color: var(--accent-green-bright); box-shadow: 0 0 10px rgba(46, 204, 113, 0.4); }

        .status-bar { margin-top: 15px; background-color: var(--bg-secondary); padding: 12px 25px; border-radius: 8px; font-size: 1.1rem; text-align: center; border: 1px solid var(--accent-green); width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>شطرنج العقل</h1>
        <nav>
            <a onclick="alert('أنت حالياً في الصفحة الرئيسية')">الرئيسية</a>
            <a onclick="alert('ميزة الإعدادات ستتوفر قريباً!')">الإعدادات</a>
            <a onclick="alert('الملف الشخصي يعمل عند تسجيل الدخول!')">الملف الشخصي</a>
        </nav>
    </header>

    <div id="auth-overlay" class="overlay">
        <div class="auth-card">
            <h2 style="color: var(--accent-green-bright); margin-bottom: 15px;">مرحباً بك!</h2>
            <p style="color: var(--text-muted); margin-bottom: 25px;">اختر طريقة الدخول لبدء اللعب</p>
            <button class="btn btn-google" onclick="loginGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
                تسجيل الدخول بحساب جوجل
            </button>
            <button class="btn btn-guest" onclick="playAsGuest()">الاستمرار كضيف</button>
        </div>
    </div>

    <div id="promotion-overlay" class="overlay" style="display: none;">
        <div class="promotion-card">
            <h3 style="color: var(--accent-green-bright); margin-bottom: 10px;">اختر قطعة الترقية</h3>
            <div class="promotion-options">
                <button class="promotion-btn" onclick="selectPromotion('q')">♛</button>
                <button class="promotion-btn" onclick="selectPromotion('r')">♜</button>
                <button class="promotion-btn" onclick="selectPromotion('n')">♞</button>
                <button class="promotion-btn" onclick="selectPromotion('b')">♝</button>
            </div>
        </div>
    </div>

    <div id="game-over-overlay" class="overlay" style="display: none;">
        <div id="game-over-card" class="game-over-card">
            <h2 id="modal-title" style="margin-bottom: 15px;">انتهت اللعبة!</h2>
            <p id="modal-body" style="color: var(--text-muted); margin-bottom: 15px; font-size: 1rem; line-height: 1.5;"></p>
            <div id="modal-stats" style="background: var(--bg-primary); padding: 10px; border-radius: 6px; margin-bottom: 20px; font-size: 0.9rem; color: var(--accent-green-bright);"></div>
            <button class="btn btn-action" onclick="closeGameOverModal()">مباراة جديدة 🔄</button>
        </div>
    </div>

    <div class="main-container">
        <div class="side-panel">
            <h3>إعدادات المباراة</h3>
            <div class="control-group">
                <label>وضع اللعب:</label>
                <select id="game-mode" onchange="startNewGame()">
                    <option value="ai">ضد الذكاء الاصطناعي (صعب جداً)</option>
                    <option value="pvp">لاعب ضد لاعب (شريك)</option>
                </select>
            </div>
            <div class="control-group">
                <label>اختر لونك (ضد الكمبيوتر):</label>
                <select id="player-color" onchange="startNewGame()">
                    <option value="white">الأبيض (تبدأ أولاً)</option>
                    <option value="black">الأسود (الكمبيوتر يبتدئ)</option>
                </select>
            </div>
            <div class="control-group">
                <label>وقت كل لاعب (بالدقائق):</label>
                <input type="number" id="time-limit" value="5" min="1" max="60" onchange="startNewGame()">
            </div>
            <div class="control-group">
                <label>الوقت المضاف لكل نقلة (ثواني):</label>
                <input type="number" id="time-increment" value="3" min="0" max="30" onchange="startNewGame()">
            </div>
            <button class="btn btn-action" onclick="startNewGame()">مباراة جديدة 🔄</button>
        </div>

        <div class="board-container">
            <div class="timer-container">
                <div class="timer-box" id="timer-black">الأسود: 05:00</div>
                <div class="timer-box" id="timer-white">الأبيض: 05:00</div>
            </div>
            <div id="board"></div>
            <div class="status-bar" id="status">جاهز للبدء</div>
        </div>

        <div class="side-panel">
            <h3>قائمة النقلات</h3>
            <div class="move-history-container">
                <table class="move-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>الأبيض</th>
                            <th>الأسود</th>
                        </tr>
                    </thead>
                    <tbody id="move-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var selectedSquare = null;
        var pendingMove = null;
        var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var pieceValues = { p: 10, r: 50, n: 30, b: 35, q: 90, k: 1000 };

        // العدادات
        var whiteTime = 300, blackTime = 300;
        var timerInterval = null;

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'move') {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'blocked') { // صوت النقر على قطعة لا تتحرك
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.15);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'loss') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'draw') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        function playAsGuest() { document.getElementById('auth-overlay').style.display = 'none'; startNewGame(); }
        function loginGoogle() { document.getElementById('auth-overlay').style.display = 'none'; startNewGame(); }

        function removeHighlights() {
            $('#board .square-55d63').removeClass('highlight-square highlight-move highlight-capture highlight-check highlight-checkmate');
        }

        function showPossibleMoves(square) {
            var moves = game.moves({ square: square, verbose: true });
            $('#board .square-' + square).addClass('highlight-square');

            for (var i = 0; i < moves.length; i++) {
                var targetSquare = moves[i].to;
                if (moves[i].captured) {
                    $('#board .square-' + targetSquare).addClass('highlight-capture');
                } else {
                    $('#board .square-' + targetSquare).addClass('highlight-move');
                }
            }
        }

        function highlightCheckEffects() {
            if (!game.in_check() && !game.in_checkmate()) return;

            var turn = game.turn();
            var kingSquare = null;
            var boardState = game.board();

            for (var r = 0; r < 8; r++) {
                for (var c = 0; c < 8; c++) {
                    var p = boardState[r][c];
                    if (p && p.type === 'k' && p.color === turn) {
                        kingSquare = String.fromCharCode(97 + c) + (8 - r);
                        break;
                    }
                }
            }

            var enemyColor = turn === 'w' ? 'b' : 'w';
            var attackerSquares = [];
            
            for (var r = 0; r < 8; r++) {
                for (var c = 0; c < 8; c++) {
                    var p = boardState[r][c];
                    if (p && p.color === enemyColor) {
                        var sq = String.fromCharCode(97 + c) + (8 - r);
                        var moves = game.moves({ square: sq, verbose: true });
                        for (var m = 0; m < moves.length; m++) {
                            if (moves[m].to === kingSquare) {
                                attackerSquares.push(sq);
                            }
                        }
                    }
                }
            }

            var highlightClass = game.in_checkmate() ? 'highlight-checkmate' : 'highlight-check';
            if (kingSquare) $('#board .square-' + kingSquare).addClass(highlightClass);
            for (var i = 0; i < attackerSquares.length; i++) {
                $('#board .square-' + attackerSquares[i]).addClass(highlightClass);
            }
        }

        function onSquareClick(square) {
            if (game.game_over()) return;

            var mode = $('#game-mode').val();
            var userColor = $('#player-color').val();
            var piece = game.get(square);

            if (mode === 'ai') {
                if (userColor === 'white' && game.turn() === 'b') return;
                if (userColor === 'black' && game.turn() === 'w') return;
            }

            // إلغاء التحديد بالنقر على نفس القطعة مجدداً
            if (selectedSquare === square) {
                selectedSquare = null;
                removeHighlights();
                highlightCheckEffects();
                return;
            }

            if (selectedSquare === null) {
                if (piece && piece.color === game.turn()) {
                    var moves = game.moves({ square: square });
                    if (moves.length === 0) {
                        playSound('blocked'); // صوت عند عدم وجود حركات
                        return;
                    }
                    selectedSquare = square;
                    removeHighlights();
                    highlightCheckEffects();
                    showPossibleMoves(square);
                }
            } else {
                var movingPiece = game.get(selectedSquare);
                var isPromotion = movingPiece && movingPiece.type === 'p' && (square.charAt(1) === '8' || square.charAt(1) === '1');

                if (isPromotion) {
                    var moves = game.moves({ square: selectedSquare, verbose: true });
                    if (moves.some(m => m.to === square)) {
                        pendingMove = { from: selectedSquare, to: square };
                        document.getElementById('promotion-overlay').style.display = 'flex';
                        return;
                    }
                }

                executeMove({ from: selectedSquare, to: square, promotion: 'q' });
            }
        }

        function selectPromotion(pieceType) {
            document.getElementById('promotion-overlay').style.display = 'none';
            if (pendingMove) {
                executeMove({ from: pendingMove.from, to: pendingMove.to, promotion: pieceType });
                pendingMove = null;
            }
        }

        function executeMove(moveObj) {
            var move = game.move(moveObj);

            if (move !== null) {
                var inc = parseInt($('#time-increment').val()) || 0;
                if (game.turn() === 'b') whiteTime += inc; else blackTime += inc;
                updateTimerDisplay();

                board.position(game.fen());
                playSound('move');
                selectedSquare = null;
                removeHighlights();
                updateStatus();

                var mode = $('#game-mode').val();
                if (mode === 'ai' && !game.game_over()) {
                    window.setTimeout(makeAiMove, 350);
                }
            } else {
                var piece = game.get(moveObj.to);
                selectedSquare = null;
                removeHighlights();
                highlightCheckEffects();
                if (piece && piece.color === game.turn()) {
                    onSquareClick(moveObj.to);
                }
            }
        }

        function evaluateBoard(gameInstance) {
            var total = 0;
            var boardState = gameInstance.board();
            for (var r = 0; r < 8; r++) {
                for (var c = 0; c < 8; c++) {
                    var p = boardState[r][c];
                    if (p) total += (p.color === 'w' ? pieceValues[p.type] : -pieceValues[p.type]);
                }
            }
            return total;
        }

        function makeAiMove() {
            var possibleMoves = game.moves({ verbose: true });
            if (possibleMoves.length === 0 || game.game_over()) return;

            var bestMove = null;
            var bestValue = game.turn() === 'b' ? 99999 : -99999;

            for (var i = 0; i < possibleMoves.length; i++) {
                var move = possibleMoves[i];
                game.move(move);
                var boardValue = evaluateBoard(game);
                if (game.in_checkmate()) boardValue = game.turn() === 'b' ? 999999 : -999999;
                game.undo();

                if (game.turn() === 'b') {
                    if (boardValue < bestValue) { bestValue = boardValue; bestMove = move; }
                } else {
                    if (boardValue > bestValue) { bestValue = boardValue; bestMove = move; }
                }
            }

            if (!bestMove) bestMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];

            var inc = parseInt($('#time-increment').val()) || 0;
            if (game.turn() === 'w') whiteTime += inc; else blackTime += inc;

            game.move(bestMove);
            board.position(game.fen());
            playSound('move');
            removeHighlights();
            updateStatus();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(function () {
                if (game.game_over()) { clearInterval(timerInterval); return; }

                if (game.turn() === 'w') {
                    whiteTime--;
                    if (whiteTime <= 0) { clearInterval(timerInterval); showGameOverModal('time', 'b'); }
                } else {
                    blackTime--;
                    if (blackTime <= 0) { clearInterval(timerInterval); showGameOverModal('time', 'w'); }
                }
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            var wMin = Math.floor(whiteTime / 60), wSec = whiteTime % 60;
            var bMin = Math.floor(blackTime / 60), bSec = blackTime % 60;

            $('#timer-white').text('الأبيض: ' + (wMin < 10 ? '0' : '') + wMin + ':' + (wSec < 10 ? '0' : '') + wSec);
            $('#timer-black').text('الأسود: ' + (bMin < 10 ? '0' : '') + bMin + ':' + (bSec < 10 ? '0' : '') + bSec);

            if (game.turn() === 'w') {
                $('#timer-white').addClass('timer-active'); $('#timer-black').removeClass('timer-active');
            } else {
                $('#timer-black').addClass('timer-active'); $('#timer-white').removeClass('timer-active');
            }
        }

        function updateStatus() {
            var status = '';
            var moveColor = game.turn() === 'b' ? 'الأسود' : 'الأبيض';
            highlightCheckEffects();

            if (game.in_checkmate()) {
                status = 'انتهت اللعبة بـ كش مات!';
                showGameOverModal('checkmate');
            } else if (game.in_draw()) {
                status = 'انتهت اللعبة بالتعادل!';
                showGameOverModal('draw');
            } else {
                status = 'الدور على: ' + moveColor;
                if (game.in_check()) status += ' (كش ملك!)';
            }

            $('#status').html(status);
            updateMoveTable();
        }

        function showGameOverModal(reason, timeWinner) {
            clearInterval(timerInterval);
            var mode = $('#game-mode').val();
            var userColor = $('#player-color').val();
            var winner = timeWinner || (game.turn() === 'w' ? 'black' : 'white');
            
            var history = game.history();
            var totalMoves = history.length;
            var whiteMovesCount = Math.ceil(totalMoves / 2);
            var blackMovesCount = Math.floor(totalMoves / 2);

            var $card = $('#game-over-card');
            $card.removeClass('border-win border-loss border-draw');
            var title = '', body = '';

            if (reason === 'draw') {
                $card.addClass('border-draw');
                title = 'تعادل!';
                body = 'انتهت المباراة بالتعادل بعد ' + totalMoves + ' نقلة!';
                playSound('draw');
            } else if (reason === 'time') {
                if ((winner === 'w' && userColor === 'white') || (winner === 'b' && userColor === 'black')) {
                    $card.addClass('border-win'); title = '🎉 فوز بالوقت!'; body = 'لقد فزت بالمباراة بنفاذ وقت الخصم!'; playSound('win');
                } else {
                    $card.addClass('border-loss'); title = 'خسارة بالوقت!'; body = 'لقد خسرت المباراة بسبب انتهاد وقتك!'; playSound('loss');
                }
            } else if (mode === 'ai') {
                if ((winner === 'white' && userColor === 'white') || (winner === 'black' && userColor === 'black')) {
                    $card.addClass('border-win');
                    title = '🎉 لقد كسبت المباراه!';
                    body = 'لقد خسرت بعد ' + totalMoves + ' نقلة بـ كش مات (انتصار ساحق ومستحق!)';
                    playSound('win');
                } else {
                    $card.addClass('border-loss');
                    title = 'لقد خسرت المباراة!';
                    body = 'لقد خسرت بعد ' + totalMoves + ' نقلة بـ كش مات';
                    playSound('loss');
                }
            } else {
                $card.addClass('border-win');
                title = 'انتهاء المباراة!';
                body = 'فاز اللاعب (' + (winner === 'white' ? 'الأبيض' : 'الأسود') + ') بـ كش مات بعد ' + totalMoves + ' نقلة!';
                playSound('win');
            }

            $('#modal-title').html(title);
            $('#modal-body').html(body);
            $('#modal-stats').html('نقلات الأبيض: <b>' + whiteMovesCount + '</b> | نقلات الأسود: <b>' + blackMovesCount + '</b>');
            $('#game-over-overlay').css('display', 'flex');
        }

        function closeGameOverModal() {
            $('#game-over-overlay').css('display', 'none');
            startNewGame();
        }

        function updateMoveTable() {
            var history = game.history();
            var html = '';
            for (var i = 0; i < history.length; i += 2) {
                var moveNum = (i / 2) + 1;
                html += '<tr><td>' + moveNum + '</td><td>' + (history[i] || '') + '</td><td>' + (history[i + 1] || '') + '</td></tr>';
            }
            $('#move-table-body').html(html);
        }

        function startNewGame() {
            game.reset();
            selectedSquare = null;
            pendingMove = null;
            removeHighlights();

            var mins = parseInt($('#time-limit').val()) || 5;
            whiteTime = mins * 60;
            blackTime = mins * 60;
            updateTimerDisplay();
            startTimer();

            var userColor = $('#player-color').val();
            var mode = $('#game-mode').val();

            var config = {
                draggable: false,
                position: 'start',
                orientation: userColor,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            board = Chessboard('board', config);

            $('#board').off('click', '.square-55d63').on('click', '.square-55d63', function () {
                var square = $(this).attr('data-square');
                onSquareClick(square);
            });

            if (mode === 'ai' && userColor === 'black') {
                window.setTimeout(makeAiMove, 400);
            }
            updateStatus();
        }
    </script>
</body>
</html>
