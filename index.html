<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الشطرنج</title>
    <!-- مكتبة أنماط رقعة الشطرنج -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 10px;
        }
        #board {
            width: 400px;
            max-width: 90vw;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        .status {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #a6adc8;
        }
    </style>
</head>
<body>

    <h1>لعبة الشطرنج</h1>
    <div id="board"></div>
    <div class="status" id="status">جاري تحضير اللعبة...</div>

    <!-- استدعاء مكتبات الشطرنج والجافاسكريبت -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');

        function onDragStart (source, piece, position, orientation) {
            // لا تسمح بتحريك القطع إذا انتهت اللعبة أو للون الأسود
            if (game.game_over()) return false;
            if (piece.search(/^b/) !== -1) return false;
        }

        function makeRandomMove () {
            var possibleMoves = game.moves();

            // إذا انتهت اللعبة
            if (possibleMoves.length === 0) return;

            var randomIdx = Math.floor(Math.random() * possibleMoves.length);
            game.move(possibleMoves[randomIdx]);
            board.position(game.fen());
            updateStatus();
        }

        function onDrop (source, target) {
            // التحقق من صحة الحركة
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' // الترقية للوزير تلقائياً للتبسيط
            });

            // حركة غير قانونية
            if (move === null) return 'snapback';

            updateStatus();

            // رد الكمبيوتر بحركة عشوائية بعد نصف ثانية (المستوى المبتدئ)
            window.setTimeout(makeRandomMove, 500);
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        function updateStatus () {
            var status = '';

            var moveColor = 'الأبيض';
            if (game.turn() === 'b') {
                moveColor = 'الأسود (الكمبيوتر)';
            }

            if (game.in_checkmate()) {
                status = 'انتهت اللعبة، كش مات! الفائز: ' + (game.turn() === 'w' ? 'الأسود' : 'الأبيض');
            } else if (game.in_draw()) {
                status = 'انتهت اللعبة بالتعادل!';
            } else {
                status = 'الدور على: ' + moveColor;
                if (game.in_check()) {
                    status += '، (كش ملك!)';
                }
            }

            $status.html(status);
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };
        board = Chessboard('board', config);

        updateStatus();
    </script>
</body>
</html>
