<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شطرنج العقل الاحترافية</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root {
            --bg-primary: #0f171e;
            --bg-secondary: #1b2631;
            --accent-green: #1b4d3e;
            --accent-green-bright: #2ecc71;
            --text-main: #ecf0f1;
            --text-muted: #bdc3c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        
        /* شريط الملاحة العلوي */
        header { background-color: var(--bg-secondary); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent-green); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        header h1 { font-size: 1.6rem; color: var(--accent-green-bright); }
        nav a { color: var(--text-muted); text-decoration: none; margin-right: 20px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        nav a:hover { color: var(--accent-green-bright); }

        /* شاشة تسجيل الدخول */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 30, 0.95);
            display: flex; justify-content: center; align-items: center; z-index: 999;
        }
        .auth-card {
            background-color: var(--bg-secondary); padding: 40px; border-radius: 12px;
            text-align: center; width: 380px; border: 1px solid var(--accent-green);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .auth-card h2 { margin-bottom: 15px; color: var(--accent-green-bright); }
        .auth-card p { color: var(--text-muted); margin-bottom: 25px; font-size: 0.95rem; }
        
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 12px; transition: 0.3s;
        }
        .btn-google { background-color: #ffffff; color: #333; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-google:hover { background-color: #e6e6e6; }
        .btn-guest { background-color: var(--accent-green); color: #fff; }
        .btn-guest:hover { background-color: #246b56; }
        .btn-action { background-color: var(--accent-green); color: #fff; margin-top: 10px; }
        .btn-action:hover { background-color: var(--accent-green-bright); color: #000; }

        /* منطقة المحتوى الرئيسية - الرقعة في المنتصف */
        .main-container { 
            display: flex; flex: 1; padding: 25px; gap: 30px; 
            justify-content: center; align-items: flex-start; max-width: 1300px; margin: 0 auto; width: 100%; 
        }
        
        /* اللوحات الجانبية */
        .side-panel { 
            background-color: var(--bg-secondary); border-radius: 12px; padding: 20px; 
            width: 300px; border: 1px solid rgba(46, 204, 113, 0.2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); 
        }
        .side-panel h3 { margin-bottom: 15px; font-size: 1.1rem; color: var(--accent-green-bright); border-bottom: 1px solid var(--accent-green); padding-bottom: 5px; }

        /* جدول النقلات المنظم */
        .move-history-container { height: 250px; overflow-y: auto; background: var(--bg-primary); border-radius: 6px; padding: 5px; }
        .move-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.9rem; }
        .move-table th { background-color: var(--accent-green); color: white; padding: 6px; }
        .move-table td { padding: 6px; border-bottom: 1px solid #2c3e50; }

        /* عناصر التحكم باللعبة */
        .control-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .control-group label { font-size: 0.9rem; color: var(--text-muted); }
        .control-group select { padding: 8px; border-radius: 6px; background: var(--bg-primary); color: white; border: 1px solid var(--accent-green); }

        /* منتصف الصفحة - الرقعة */
        .board-container { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #board { width: 480px; max-width: 85vw; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 3px solid var(--accent-green); }
        .status-bar { margin-top: 15px; background-color: var(--bg-secondary); padding: 12px 25px; border-radius: 8px; font-size: 1.1rem; text-align: center; border: 1px solid var(--accent-green); width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>شطرنج العقل</h1>
        <nav>
            <a onclick="alert('أنت حالياً في الصفحة الرئيسية')">الرئيسية</a>
            <a onclick="alert('ميزة الإعدادات ستتوفر قريباً!')">الإعدادات</a>
            <a onclick="alert('الملف الشخصي يعمل عند تسجيل الدخول!')">الملف الشخصي</a>
        </nav>
    </header>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>مرحباً بك!</h2>
            <p>اختر طريقة الدخول لبدء اللعب</p>
            <button class="btn btn-google" onclick="loginGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
                تسجيل الدخول بحساب جوجل
            </button>
            <button class="btn btn-guest" onclick="playAsGuest()">الاستمرار كضيف</button>
        </div>
    </div>

    <div class="main-container">
        
        <!-- اللوحة اليمنى: إعدادات المباراة -->
        <div class="side-panel">
            <h3>إعدادات المباراة</h3>
            
            <div class="control-group">
                <label>وضع اللعب:</label>
                <select id="game-mode" onchange="startNewGame()">
                    <option value="ai">ضد الذكاء الاصطناعي</option>
                    <option value="pvp">لاعب ضد لاعب (شريك)</option>
                </select>
            </div>

            <div class="control-group">
                <label>اختر لونك (في وضع الذكاء الاصطناعي):</label>
                <select id="player-color" onchange="startNewGame()">
                    <option value="white">الأبيض (تبدأ أولاً)</option>
                    <option value="black">الأسود (الكمبيوتر يبتدئ)</option>
                </select>
            </div>

            <button class="btn btn-action" onclick="startNewGame()">مباراة جديدة 🔄</button>
        </div>

        <!-- المنتصف: رقعة الشطرنج -->
        <div class="board-container">
            <div id="board"></div>
            <div class="status-bar" id="status">سجل الدخول أو ادخل كضيف للبدء</div>
        </div>

        <!-- اللوحة اليسرى: قائمة النقلات -->
        <div class="side-panel">
            <h3>قائمة النقلات</h3>
            <div class="move-history-container">
                <table class="move-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>الأبيض</th>
                            <th>الأسود</th>
                        </tr>
                    </thead>
                    <tbody id="move-table-body">
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');

        function playAsGuest() {
            document.getElementById('auth-overlay').style.display = 'none';
            startNewGame();
        }

        function loginGoogle() {
            document.getElementById('auth-overlay').style.display = 'none';
            alert("تم تسجيل الدخول بنجاح! مرحباً بك.");
            startNewGame();
        }

        function makeAiMove() {
            var possibleMoves = game.moves();
            if (possibleMoves.length === 0 || game.game_over()) return;

            var randomIdx = Math.floor(Math.random() * possibleMoves.length);
            game.move(possibleMoves[randomIdx]);
            board.position(game.fen());
            updateStatus();
        }

        function onDragStart (source, piece) {
            if (game.game_over()) return false;

            var mode = $('#game-mode').val();
            var userColor = $('#player-color').val();

            if (mode === 'ai') {
                if (userColor === 'white' && piece.search(/^b/) !== -1) return false;
                if (userColor === 'black' && piece.search(/^w/) !== -1) return false;
            }
        }

        function onDrop (source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';

            updateStatus();

            var mode = $('#game-mode').val();
            if (mode === 'ai' && !game.game_over()) {
                window.setTimeout(makeAiMove, 300);
            }
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        function updateStatus () {
            var status = '';
            var moveColor = game.turn() === 'b' ? 'الأسود' : 'الأبيض';

            if (game.in_checkmate()) {
                status = 'انتهت اللعبة! كش مات، الفائز: ' + (game.turn() === 'w' ? 'الأسود' : 'الأبيض');
            } else if (game.in_draw()) {
                status = 'انتهت اللعبة بالتعادل!';
            } else {
                status = 'الدور على: ' + moveColor;
                if (game.in_check()) status += ' (كش ملك!)';
            }

            $status.html(status);
            updateMoveTable();
        }

        function updateMoveTable() {
            var history = game.history();
            var html = '';
            for (var i = 0; i < history.length; i += 2) {
                var moveNum = (i / 2) + 1;
                var whiteMove = history[i] || '';
                var blackMove = history[i + 1] || '';
                html += '<tr><td>' + moveNum + '</td><td>' + whiteMove + '</td><td>' + blackMove + '</td></tr>';
            }
            $('#move-table-body').html(html);
        }

        function startNewGame() {
            game.reset();
            var userColor = $('#player-color').val();
            var mode = $('#game-mode').val();

            var config = {
                draggable: true,
                position: 'start',
                orientation: userColor,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            };
            board = Chessboard('board', config);

            if (mode === 'ai' && userColor === 'black') {
                window.setTimeout(makeAiMove, 300);
            }
            updateStatus();
        }
    </script>
</body>
</html>
